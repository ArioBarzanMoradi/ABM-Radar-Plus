name: گزارش ایراد
description: مشکلی در پنل، عامل یا نصب جمشید پلاس
body:
  - type: textarea
    id: issue
    attributes:
      label: رفتار مشاهده‌شده و انتظار
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: نسخهٔ برنامه، لینوکس، Python و معماری
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: مراحل تکرار و گزارش خطا
      description: گذرواژه، کلید عامل، فایل پیکربندی واقعی و نشانی خصوصی را حذف کنید.
