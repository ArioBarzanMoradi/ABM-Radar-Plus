name: Validate ABM Radar Plus
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n install.sh install-agent.sh scripts/update.sh scripts/enable-ssl.sh scripts/radarctl
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: abm-radar-plus-release
          path: dist/*.zip
