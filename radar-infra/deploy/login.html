<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود به رادار</title><link rel="icon" href="./assets/favicon.svg"><link rel="stylesheet" href="./assets/style.css"><script src="./assets/login.js" defer></script></head><body class="auth-screen"><main class="auth-card panel"><div class="brand"><img src="./assets/favicon.svg" alt="" width="48" height="48"><span><b>رادار</b><small>مرکز پایش زیرساخت</small></span></div><h1>ورود به پنل خصوصی</h1><form id="login" class="form-stack"><label class="field"><span>نام کاربری</span><input name="username" autocomplete="username" maxlength="64" required autofocus dir="auto"></label><label class="field"><span>گذرواژه</span><input name="password" type="password" maxlength="256" autocomplete="current-password" required dir="ltr"></label><p id="error" role="alert" hidden></p><button class="btn primary">ورود به پنل</button></form><a class="text-btn" href="./demo.html">مشاهده نسخهٔ نمایشی</a></main></body></html>
